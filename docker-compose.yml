# The long-lived local dashboard is owned by this Compose project.  Keeping
# this name stable lets the deployment script and the post-commit hook update
# the same container instead of competing for its fixed container name.
name: pdb-deploy

services:
  dashboard:
    build: .
    container_name: personal-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      # чтобы контейнер видел Ollama, запущенную на хосте (или в соседнем контейнере с опубликованным портом)
      - "host.docker.internal:host-gateway"
    environment:
      TASKS_FILE: /data/tasks.json
      # Не даёт приложению принять пропавший production-файл за пустой список задач.
      TASKS_PROTECTION_ENABLED: "true"
      V1_V2_SYNC_KEY: ${V1_V2_SYNC_KEY:-}
      V2_PEER_URL: ${V2_PEER_URL:-http://host.docker.internal:8090}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma4:e4b-it-qat}
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash-0731}
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter-api-key
      # Общая память агентов: URL гейтвея (localhost внутри контейнера — свой; поэтому host.docker.internal)
      MEMORY_GATEWAY_URL: "${MEMORY_GATEWAY_URL:-http://host.docker.internal:8766}"
      MEMORY_API_KEY_FILE: /run/secrets/agent-memory-api-key
    volumes:
      # Каталог данных не зависит от расположения клона репозитория.
      - ${DASHBOARD_DATA_DIR:-C:/Main/crystal_wave/Data/personal-dashboard}:/data
    secrets:
      - agent-memory-api-key
      - openrouter-api-key

secrets:
  agent-memory-api-key:
    file: ${CRYSTAL_WAVE_SECRETS_DIR:-C:/Main/crystal_wave/Secrets}/agent-memory-api-key
  openrouter-api-key:
    file: ${CRYSTAL_WAVE_SECRETS_DIR:-C:/Main/crystal_wave/Secrets}/open-router-api-key-vs-code.txt
